name: Deploy Frontend to Vercel - Test

on:
  push:
    branches:
      - '**'  # ejecuta en cualquier rama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧩 1. Clona el repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🧩 2. Configura Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🧩 3. Depuración: imprime entorno y estructura
      - name: Debug Info
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          echo "Current directory:"
          pwd
          echo "Listing files in root:"
          ls -la
          echo "Listing files in client/:"
          ls -la ./client || echo "⚠️ No client directory found"

      # 🧩 4. Verifica variables de entorno (sin mostrar secretos)
      - name: Check environment variables
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then echo "❌ Missing VERCEL_TOKEN"; exit 1; else echo "✅ VERCEL_TOKEN is set"; fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then echo "❌ Missing VERCEL_ORG_ID"; exit 1; else echo "✅ VERCEL_ORG_ID is set"; fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then echo "❌ Missing VERCEL_PROJECT_ID"; exit 1; else echo "✅ VERCEL_PROJECT_ID is set"; fi

      # 🧩 5. Instala dependencias y construye el proyecto
      - name: Install and Build
        working-directory: ./client
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Building project..."
          npm run build

      # 🧩 6. Depuración: comprueba el resultado del build
      - name: Check build output
        run: |
          echo "Build directory structure:"
          ls -la ./client/dist || echo "⚠️ No dist directory found"

      # 🧩 7. Despliegue en Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'  # puedes quitarlo si solo quieres preview
